name: Build ass-media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709"

      - name: Build aars (native + kt + media)
        run: |
          chmod +x ./gradlew
          ./gradlew :lib_ass_media:assembleRelease --no-daemon

      - name: Assemble maven repo
        run: |
          set -e
          VER=0.5.0-fongmi-fix
          # ass-kt (native libass + JNI)
          KDIR=repo/io/github/peerless2012/ass-kt/$VER
          mkdir -p $KDIR
          KT_AAR=$(find lib_ass_kt/build -name "*.aar" | head -1)
          cp $KT_AAR $KDIR/ass-kt-$VER.aar
          cat > $KDIR/ass-kt-$VER.pom <<POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>io.github.peerless2012</groupId>
            <artifactId>ass-kt</artifactId>
            <version>$VER</version>
            <packaging>aar</packaging>
            <name>ass-kt</name>
            <description>Kotlin bindings and JNI for libass.</description>
            <dependencies>
              <dependency><groupId>org.jetbrains.kotlin</groupId><artifactId>kotlin-stdlib</artifactId><version>2.2.0</version><scope>compile</scope></dependency>
            </dependencies>
          </project>
          POM
          cat > $KDIR/maven-metadata.xml <<META
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>io.github.peerless2012</groupId>
            <artifactId>ass-kt</artifactId>
            <versioning>
              <latest>$VER</latest>
              <release>$VER</release>
              <versions>
                <version>$VER</version>
              </versions>
              <lastUpdated>20260812000000</lastUpdated>
            </versioning>
          </metadata>
          META
          # ass-media (Media3 integration)
          MDIR=repo/io/github/peerless2012/ass-media/$VER
          mkdir -p $MDIR
          MEDIA_AAR=$(find lib_ass_media/build -name "*.aar" | head -1)
          cp $MEDIA_AAR $MDIR/ass-media-$VER.aar
          cat > $MDIR/ass-media-$VER.pom <<POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd" xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <modelVersion>4.0.0</modelVersion>
            <groupId>io.github.peerless2012</groupId>
            <artifactId>ass-media</artifactId>
            <version>$VER</version>
            <packaging>aar</packaging>
            <name>ass-media</name>
            <description>A Androidx media extension for libass.</description>
            <dependencies>
              <dependency><groupId>org.jetbrains.kotlin</groupId><artifactId>kotlin-stdlib</artifactId><version>2.2.0</version><scope>compile</scope></dependency>
              <dependency><groupId>androidx.annotation</groupId><artifactId>annotation</artifactId><version>1.9.1</version><scope>runtime</scope></dependency>
              <dependency><groupId>androidx.annotation</groupId><artifactId>annotation-experimental</artifactId><version>1.5.1</version><scope>runtime</scope></dependency>
              <dependency><groupId>androidx.media3</groupId><artifactId>media3-exoplayer</artifactId><version>1.8.0</version><scope>runtime</scope></dependency>
              <dependency><groupId>androidx.media3</groupId><artifactId>media3-ui</artifactId><version>1.8.0</version><scope>runtime</scope></dependency>
              <dependency><groupId>androidx.media3</groupId><artifactId>media3-effect</artifactId><version>1.8.0</version><scope>runtime</scope></dependency>
              <dependency><groupId>io.github.peerless2012</groupId><artifactId>ass-kt</artifactId><version>$VER</version><scope>runtime</scope></dependency>
            </dependencies>
          </project>
          POM
          cat > $MDIR/maven-metadata.xml <<META
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>io.github.peerless2012</groupId>
            <artifactId>ass-media</artifactId>
            <versioning>
              <latest>$VER</latest>
              <release>$VER</release>
              <versions>
                <version>$VER</version>
              </versions>
              <lastUpdated>20260812000000</lastUpdated>
            </versioning>
          </metadata>
          META
          # parent metadata files
          cat > repo/io/github/peerless2012/ass-kt/maven-metadata.xml <<META
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>io.github.peerless2012</groupId>
            <artifactId>ass-kt</artifactId>
            <versioning>
              <latest>$VER</latest>
              <release>$VER</release>
              <versions>
                <version>$VER</version>
              </versions>
              <lastUpdated>20260812000000</lastUpdated>
            </versioning>
          </metadata>
          META
          cat > repo/io/github/peerless2012/ass-media/maven-metadata.xml <<META
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>io.github.peerless2012</groupId>
            <artifactId>ass-media</artifactId>
            <versioning>
              <latest>$VER</latest>
              <release>$VER</release>
              <versions>
                <version>$VER</version>
              </versions>
              <lastUpdated>20260812000000</lastUpdated>
            </versioning>
          </metadata>
          META
          ls -laR repo/

      - uses: actions/upload-artifact@v4
        with:
          name: ass-media-maven-repo
          path: repo/
          if-no-files-found: error
